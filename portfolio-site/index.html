<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="小野的个人主页，收录视频作品、创作服务和合作联系方式。">
  <title>小野 · 个人主页</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="site-content.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body id="top">
  <div class="entry" id="opening" hidden>
    <div class="entry-card">
      <div class="avatar entry-avatar" data-avatar aria-hidden="true"><span data-initial>野</span></div>
      <div class="entry-identity">
        <p class="entry-name" data-brand>小野</p>
        <p class="entry-topic" data-topic>影像、设计与 AI 实验</p>
      </div>
    </div>
    <button class="entry-skip" type="button">跳过开场</button>
  </div>
  <a class="skip" href="#videos">跳到视频作品</a>
  <main class="shell">
    <section class="profile-card" aria-labelledby="profile-title">
      <div class="profile-lead" data-intro-step>
        <div class="profile-copy">
          <p class="profile-topic" data-topic>影像、设计与 AI 实验</p>
          <h1 id="profile-title" tabindex="-1" data-brand>小野</h1>
          <p class="profile-description" data-intro>做视频剪辑、视觉设计和 AI 影像。</p>
        </div>
        <div class="avatar hero-avatar" data-avatar role="img" aria-label="小野的示例头像"><span data-initial>野</span></div>
      </div>

      <section class="profile-row" id="contact" aria-labelledby="contact-title" data-intro-step>
        <h2 id="contact-title">联系方式</h2>
        <div id="contact-links" class="contact-links"></div>
        <p class="section-note contact-feedback" id="copy-status" role="status"></p>
      </section>
      <div class="profile-actions" data-intro-step>
        <a class="button primary" href="#videos">浏览作品 <span aria-hidden="true">↓</span></a>
        <a class="text-link" href="#services">查看服务 <span aria-hidden="true">↗</span></a>
      </div>
    </section>

    <section class="section" id="videos" tabindex="-1" aria-labelledby="videos-title">
      <div class="section-head" data-reveal>
        <h2 id="videos-title">视频作品集</h2>
        <p class="section-note" id="video-count"></p>
      </div>
      <div class="video-grid" id="video-list"></div>
    </section>
    <section class="section" id="services" tabindex="-1" aria-labelledby="services-title">
      <div class="section-head" data-reveal>
        <h2 id="services-title">我能提供的服务</h2>
      </div>
      <div class="service-grid" id="service-list"></div>
    </section>
  </main>

  <footer class="site-footer shell"><a href="#top">回到顶部 <span aria-hidden="true">↑</span></a></footer>

  <dialog id="project-dialog" aria-labelledby="project-title">
    <div class="dialog-head">
      <h2 id="project-title"></h2>
      <button type="button" class="dialog-close" id="close-dialog" aria-label="关闭">×</button>
    </div>
    <div id="project-media" class="project-media"></div>
    <p id="project-description"></p>
  </dialog>
</body>
</html>
