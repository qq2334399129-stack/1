<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>网站后台 · 小野</title>
  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/admin.css?v=2">
  <script src="/admin.js?v=2" defer></script>
</head>
<body>
  <main class="admin-shell">
    <header><div><h1>网站后台</h1><a href="/" target="_blank" rel="noopener">查看网站 ↗</a></div><button id="logout" type="button" hidden>退出登录</button></header>
    <div class="surface" id="connection-status">
      <h2>检查后台连接</h2>
      <p class="notice" id="connection-message" role="status">正在连接后台…</p>
      <p class="hint" id="connection-help" hidden>在宝塔启动 Node 项目，把这个域名反向代理到它的端口。直接访问 <a href="/api/health">后台状态接口</a>，应返回 xiaoye-portfolio。部署命令见压缩包内 README.txt。</p>
    </div>
    <form id="login" class="surface" hidden>
      <h2>管理员登录</h2>
      <label>用户名<input name="username" autocomplete="username" value="admin" required></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">登录</button>
      <p class="notice" id="login-status" role="status"></p>
    </form>
    <div id="dashboard" hidden>
      <nav id="sections" aria-label="后台栏目"></nav>
      <div class="publish-bar">
        <p id="status" class="notice" role="status"></p>
        <button type="button" class="primary" id="save">保存并发布</button>
      </div>
      <div id="editor"></div>
    </div>
  </main>
</body>
</html>
