<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10120f">
  <meta name="description" content="小野的影像、SKU 作品和人物建筑资产。">
  <title>小野 · 个人主页</title>
  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css?v=3">
  <style>
    :root { --home-ease: cubic-bezier(.22, .61, .36, 1); }

    .home-header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 5;
      padding-top: max(12px, env(safe-area-inset-top));
      pointer-events: none;
    }

    .home-nav {
      justify-content: flex-end;
      gap: 8px;
    }

    .home-nav a {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 44px;
      padding: 0 13px;
      border: 1px solid rgba(255, 255, 255, .23);
      border-radius: 999px;
      background: rgba(16, 18, 15, .44);
      color: #f5f3e9;
      font-weight: 650;
      backdrop-filter: blur(10px);
      transition: background-color .25s var(--home-ease), border-color .25s var(--home-ease),
        transform .25s var(--home-ease);
    }

    .home-nav a::after { content: none; }
    .home-nav a span { color: inherit; margin: 0; }
    .home-nav svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .index-motion :is(.button, .text-link, .page-link, .carousel-controls button, .dialog-close, .media-cover) {
      transition: transform .25s var(--home-ease), background-color .25s var(--home-ease),
        border-color .25s var(--home-ease), color .25s var(--home-ease);
    }

    .index-motion :is(.home-nav a, .button, .text-link, .page-link, .carousel-controls button:not(:disabled),
      .dialog-close, .media-cover):active { transform: scale(.96); }

    .media-cover img, .media-cover .play-mark {
      transition: transform .42s var(--home-ease), background-color .25s var(--home-ease);
    }

    @media (hover: hover) {
      .home-nav a:hover {
        background-color: rgba(16, 18, 15, .72);
        border-color: rgba(220, 235, 183, .62);
      }
      .index-motion .home-nav a:hover:not(:active) { transform: translateY(-2px); }
      .index-motion .media-cover:hover img { transform: scale(1.035); }
      .index-motion .media-cover:hover .play-mark { transform: scale(1.08); background-color: #253322; }
    }

    .index-motion { scroll-behavior: smooth; }
    .index-motion .home-nav { animation: home-arrive .44s var(--home-ease) both; }
    .index-motion .hero-content, .index-motion .motion .hero-content {
      animation: home-arrive .64s .08s var(--home-ease) both;
    }

    .index-motion [data-home-reveal] {
      transition: opacity .52s var(--home-ease), transform .52s var(--home-ease);
    }

    .index-motion [data-home-reveal].home-waiting:not(:focus-within) { opacity: 0; transform: translateY(14px); }
    .index-motion dialog[open] { animation: home-preview .34s var(--home-ease) both; }
    .index-motion dialog[open]::backdrop { animation: home-backdrop .3s var(--home-ease) both; }

    @keyframes home-arrive {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes home-preview {
      from { opacity: 0; transform: translateY(15px) scale(.985); }
      to { opacity: 1; transform: none; }
    }

    @keyframes home-backdrop {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 750px) {
      .home-header { padding-top: max(8px, env(safe-area-inset-top)); }
      .home-nav { gap: 6px; }
      .home-nav a { padding-inline: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .index-motion { scroll-behavior: auto; }
      .index-motion [data-home-reveal].home-waiting:not(:focus-within) { opacity: 1; transform: none; }
      .index-motion :is(.home-nav a, .button, .text-link, .page-link, .carousel-controls button,
        .dialog-close, .media-cover):active { transform: none; }
      .index-motion .home-nav a:hover:not(:active), .index-motion .media-cover:hover :is(img, .play-mark) {
        transform: none;
      }
    }
  </style>
  <script>
    if (matchMedia('(prefers-reduced-motion: no-preference)').matches) {
      document.documentElement.classList.add('index-motion');
    }
  </script>
  <script src="/app.js?v=3" defer></script>
</head>
<body id="top">
  <a class="skip" href="#videos">跳到视频</a>
  <header class="home-header">
    <div class="shell">
      <nav class="home-nav" aria-label="作品导航">
        <a href="#videos">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="4" width="15" height="12" rx="2.5"/><path d="m8 7 4.5 3L8 13z"/></svg>
          <span>视频</span>
        </a>
        <a href="/sku/">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5 17 6v8l-7 3.5L3 14V6zM3 6l7 3.5L17 6M10 9.5v8"/></svg>
          <span>SKU</span>
        </a>
        <a href="/assets-library/">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m2.5 7 7.5-4 7.5 4-7.5 4zm0 3.5 7.5 4 7.5-4m-15 3.5 7.5 4 7.5-4"/></svg>
          <span>资产</span>
        </a>
      </nav>
    </div>
  </header>
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-stage">
        <figure class="hero-figure"><img id="hero-photo" src="/assets/ridge.webp" alt="晨光中的山脊" fetchpriority="high"></figure>
        <div class="hero-inner shell">
          <div class="hero-content">
            <img class="home-avatar" id="avatar" alt="头像" hidden>
            <p class="hero-topic" id="topic">影像、设计与 AI 创作</p>
            <h1 id="hero-title"><span data-brand>小野</span><span class="title-dot" aria-hidden="true">.</span></h1>
            <p class="hero-description" id="intro">这里放我的影像、SKU 作品和人物／建筑资产。</p>
            <p class="home-services" id="services"></p>
            <div class="hero-actions">
              <a href="#videos" class="button primary">看视频 <span aria-hidden="true">↓</span></a>
              <button type="button" class="button quiet" id="open-contact">联系我 <span aria-hidden="true">↗</span></button>
              <a class="button quiet" id="subscription" data-external hidden></a>
            </div>
            <div class="home-links" id="quick-contact" aria-label="联系入口"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="section shell" id="videos" data-home-reveal aria-labelledby="videos-title">
      <div class="section-head"><h2 id="videos-title">视频放映室</h2><p class="section-note" id="video-count"></p></div>
      <div id="video-list" class="video-track" role="region" aria-label="左右滑动浏览视频"></div>
      <div class="carousel-controls" id="carousel-controls" hidden>
        <button type="button" aria-label="上一部视频" id="video-prev">←</button>
        <span id="video-position" aria-live="polite"></span>
        <button type="button" aria-label="下一部视频" id="video-next">→</button>
      </div>
    </section>

    <section class="section shell" data-home-reveal aria-label="更多作品">
      <div class="gallery-links">
        <a class="tile page-link" href="/sku/"><span id="sku-link">SKU 作品集</span><span aria-hidden="true">↗</span></a>
        <a class="tile page-link" href="/assets-library/"><span id="assets-link">人物与建筑资产</span><span aria-hidden="true">↗</span></a>
      </div>
    </section>

    <section class="section shell" id="tools" data-home-reveal aria-labelledby="tools-title" hidden>
      <div class="section-head"><h2 id="tools-title">AI 工具分享</h2></div>
      <div class="gallery-grid" id="tool-list"></div>
    </section>
    <footer class="site-footer shell" data-home-reveal>
      <p id="skills"></p><button type="button" class="text-link" id="skill-contact">联系我 ↗</button>
    </footer>
  </main>
  <dialog id="project-dialog" aria-labelledby="project-title">
    <div class="dialog-head"><h2 id="project-title"></h2><button type="button" class="dialog-close" aria-label="关闭">×</button></div>
    <div id="project-media" class="project-media"></div>
    <div id="project-details" class="dialog-details"></div>
  </dialog>
  <script>
    if (document.documentElement.classList.contains('index-motion') && 'IntersectionObserver' in window) {
      const observer = new IntersectionObserver(entries => {
        for (const entry of entries) {
          if (!entry.isIntersecting) continue;
          entry.target.classList.remove('home-waiting');
          observer.unobserve(entry.target);
        }
      }, { rootMargin: '0px 0px 20px 0px' });
      for (const section of document.querySelectorAll('[data-home-reveal]')) {
        if (section.getBoundingClientRect().top <= innerHeight) continue;
        section.classList.add('home-waiting');
        observer.observe(section);
      }
    }
  </script>
</body>
</html>
