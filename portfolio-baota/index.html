<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10120f">
  <meta name="description" content="小野的影像、SKU 作品和人物建筑资产。">
  <title>小野 · 个人主页</title>
  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css?v=3">
  <script src="/app.js?v=3" defer></script>
</head>
<body id="top">
  <a class="skip" href="#videos">跳到视频</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a href="/" class="brand"><span data-brand>小野</span></a>
      <nav aria-label="主导航">
        <a href="#videos">视频</a><a href="/sku/">SKU</a><a href="/assets-library/">资产</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-stage">
        <figure class="hero-figure"><img id="hero-photo" src="/assets/ridge.webp" alt="晨光中的山脊" fetchpriority="high"></figure>
        <div class="hero-inner shell">
          <div class="hero-content">
            <img class="home-avatar" id="avatar" alt="头像" hidden>
            <p class="hero-topic" id="topic">影像、设计与 AI 创作</p>
            <h1 id="hero-title"><span data-brand>小野</span><span class="title-dot" aria-hidden="true">.</span></h1>
            <p class="hero-description" id="intro">这里放我的影像、SKU 作品和人物／建筑资产。</p>
            <p class="home-services" id="services"></p>
            <div class="hero-actions">
              <a href="#videos" class="button primary">看视频 <span aria-hidden="true">↓</span></a>
              <button type="button" class="button quiet" id="open-contact">联系我 <span aria-hidden="true">↗</span></button>
              <a class="button quiet" id="subscription" data-external hidden></a>
            </div>
            <div class="home-links" id="quick-contact" aria-label="联系入口"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="section shell" id="videos" aria-labelledby="videos-title">
      <div class="section-head"><h2 id="videos-title">视频放映室</h2><p class="section-note" id="video-count"></p></div>
      <div id="video-list" class="video-track" role="region" aria-label="左右滑动浏览视频"></div>
      <div class="carousel-controls" id="carousel-controls" hidden>
        <button type="button" aria-label="上一部视频" id="video-prev">←</button>
        <span id="video-position" aria-live="polite"></span>
        <button type="button" aria-label="下一部视频" id="video-next">→</button>
      </div>
    </section>

    <section class="section shell" aria-label="更多作品">
      <div class="gallery-links">
        <a class="tile page-link" href="/sku/"><span id="sku-link">SKU 作品集</span><span aria-hidden="true">↗</span></a>
        <a class="tile page-link" href="/assets-library/"><span id="assets-link">人物与建筑资产</span><span aria-hidden="true">↗</span></a>
      </div>
    </section>

    <section class="section shell" id="tools" aria-labelledby="tools-title" hidden>
      <div class="section-head"><h2 id="tools-title">AI 工具分享</h2></div>
      <div class="gallery-grid" id="tool-list"></div>
    </section>
    <footer class="site-footer shell">
      <p id="skills"></p><button type="button" class="text-link" id="skill-contact">联系我 ↗</button>
    </footer>
  </main>
  <dialog id="project-dialog" aria-labelledby="project-title">
    <div class="dialog-head"><h2 id="project-title"></h2><button type="button" class="dialog-close" aria-label="关闭">×</button></div>
    <div id="project-media" class="project-media"></div>
    <div id="project-details" class="dialog-details"></div>
  </dialog>
</body>
</html>
